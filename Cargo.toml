[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["app", "common", "wasm"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1.10"
console = "0.16"
const-hex = "1.14"
cosmic-text = "0.14"
ed25519-dalek = "2"
humantime = "2.2"
image = "0.25"
itertools = "0.14"
nu-cmd-extra = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-cmd-lang = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-command = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-engine = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-experimental = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-parser = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-path = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-protocol = { git = "https://github.com/nushell/nushell.git", default-features = false }
nu-utils = { git = "https://github.com/nushell/nushell.git", default-features = false }
nuon = { git = "https://github.com/nushell/nushell.git", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
serde = "1"
serde_json = "1"
shuttle-axum = "0.56"
shuttle-runtime = "0.56"
static-toml = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
twilight-http = "0.16"
twilight-model = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }
vt100 = "0.16"
wasmtime = "35"
wasmtime-wasi = "35"
wit-bindgen = "0.43"
