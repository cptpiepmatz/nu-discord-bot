[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["app", "wasm", "register"]
default-members = ["app", "wasm"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
const-hex = "1.14"
ed25519-dalek = "2"
serde = "1"
serde_json = "1"
shuttle-axum = "0.53"
shuttle-runtime = "0.53"
static-toml = "1.3"
tokio = { version = "1", features = ["rt", "macros"] }
twilight-http = "0.16"
twilight-model = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }
